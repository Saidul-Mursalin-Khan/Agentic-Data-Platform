[project]
name = "agentic-data-platform"
version = "0.1.0"
description = "Agentic Data Platform with FastAPI"
readme = "README.md"
authors = [
    { name = "Saidul-Mursalin-Khan", email = "saidul.khan@tuhh.de" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "langchain",
    "langchain-openai",
    "langgraph",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
agentic-data-platform = "agentic_data_platform:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
